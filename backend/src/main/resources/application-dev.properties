# ── H2 in-memory database (dev — no install required) ──────────────────────
spring.datasource.url=jdbc:h2:mem:ngodms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA — create schema from entities, seed via DataInitializer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=dev_jwt_secret_key_change_in_production_min_32_chars
app.jwt.expiration=86400000

# Logging
logging.level.com.ngodms=DEBUG

